name: cd

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: rakaiseto/rakaiseto.com

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & Push Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_LASTFM_USER=${{ secrets.VITE_LASTFM_USER }}
            VITE_LASTFM_KEY=${{ secrets.VITE_LASTFM_KEY }}

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via Dokploy
        run: |
          PROJECT_NAME="rakaiseto-com"
          COMPOSE_NAME="web"

          PROJECTS=$(curl -s -X GET \
            "${{ secrets.DOKPLOY_HOST }}/api/project.all" \
            -H "accept: application/json" \
            -H "x-api-key: ${{ secrets.DOKPLOY_API_KEY }}")

          COMPOSE_ID=$(echo "$PROJECTS" | jq -r "
            .[] | select(.name == \"$PROJECT_NAME\") |
            .environments[].compose[] |
            select(.name == \"$COMPOSE_NAME\") |
            .composeId
          ")

          if [ -z "$COMPOSE_ID" ]; then
            echo "ERROR: compose $COMPOSE_NAME not found in project $PROJECT_NAME"
            exit 1
          fi

          echo "Deploying composeId: $COMPOSE_ID"

          curl -s -X POST \
            "${{ secrets.DOKPLOY_HOST }}/api/compose.deploy" \
            -H "accept: application/json" \
            -H "x-api-key: ${{ secrets.DOKPLOY_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d "{\"composeId\": \"$COMPOSE_ID\"}"
