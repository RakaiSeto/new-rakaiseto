name: cd

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # VITE_* values are baked into the client bundle at build time — the
      # /vibes last.fm feed degrades to its notice state when they are absent.
      - name: Build
        run: npm run build
        env:
          VITE_LASTFM_USER: ${{ secrets.VITE_LASTFM_USER }}
          VITE_LASTFM_KEY: ${{ secrets.VITE_LASTFM_KEY }}

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
