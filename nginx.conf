server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # gzip static assets
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # hashed build assets — cache hard
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # live tokscale data for the /ai page — the browser can't read
    # tokscale.ai directly (no CORS headers), so this same-origin proxy
    # forwards /toks/<user> to the public API
    location /toks/ {
        proxy_pass https://tokscale.ai/api/users/;
        proxy_set_header Host tokscale.ai;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 15s;
    }

    # SPA fallback: every route serves index.html so React Router owns the URL
    location / {
        try_files $uri $uri/ /index.html;
    }

    # never cache the shell — new deploys must be picked up immediately
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
