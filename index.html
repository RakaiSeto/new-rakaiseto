<html lang="en" class="dark">
  <head>

    <link rel="icon" type="image/svg+xml" href="/public/images/logo.png" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Rakai Seto Sembodo" />
    <meta property="og:title" content="Rakai Seto Sembodo — Fullstack Developer" />

    <meta property="og:url" content="https://rakaiseto.com/" />
    <meta property="og:image" content="https://rakaiseto.com/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Rakai Seto Sembodo — fullstack developer. I build systems that survive production." />

    <!-- Twitter / X -->
